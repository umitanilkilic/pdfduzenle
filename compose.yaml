# pdfduzenle.tr – new stack (web + gateway + ocr).
# The reverse proxy on the external `webnet` network should forward
#   /api/*      → gateway:8080   (uploads go straight to Go, no buffering in Node)
#   everything  → web:3000
# Routing only to web:3000 also works: Next rewrites /api/* to the gateway.
services:
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SITE_URL: https://pdfduzenle.tr
        GATEWAY_URL: http://gateway:8080
    depends_on: [gateway]
    ports:
      - "3000:3000"
    networks: [internal, webnet]
    restart: unless-stopped

  gateway:
    build: ./services/gateway
    environment:
      GATEWAY_MAX_UPLOAD_MB: "100"
      GATEWAY_JOB_TTL: 1h
      GATEWAY_OFFICE_WORKERS: "2"
      GATEWAY_GS_WORKERS: "2"
      GATEWAY_OCR_WORKERS: "2"
      # Proxies that append to X-Forwarded-For before the gateway (used for rate limiting):
      # 1 when the reverse proxy sends /api straight here, 2 when /api goes through web.
      GATEWAY_TRUSTED_PROXY_HOPS: "1"
      OCR_SERVICE_URL: http://ocr:8000
    tmpfs:
      - /tmp:size=4g
    networks: [internal, webnet]
    restart: unless-stopped

  ocr:
    build: ./services/ocr
    environment:
      # Unlimited-OCR (Unlimited-OCR on a rented GPU, OpenAI-compatible API). Leave empty to use Tesseract only.
      UNLIMITED_OCR_BASE_URL: ${UNLIMITED_OCR_BASE_URL:-}
      UNLIMITED_OCR_API_KEY: ${UNLIMITED_OCR_API_KEY:-}
      UNLIMITED_OCR_MODEL: ${UNLIMITED_OCR_MODEL:-Unlimited-OCR}
      UNLIMITED_OCR_MAX_PAGES: "50"
      OCR_MAX_PAGES: "300"
      OCR_JOBS: "2"
    tmpfs:
      - /tmp:size=4g
    networks: [internal]
    restart: unless-stopped

networks:
  internal:
  webnet:
    external: true
