[project]
name = "pdfduzenle-ocr"
version = "0.1.0"
description = "Internal OCR and PDF-to-Word service for pdfduzenle.tr"
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "ocrmypdf>=17.12.1",
  "pikepdf>=10.13.0.post1",
  "pypdfium2>=5.13.0",
  "python-docx>=1.2.0",
  "markdown>=3.11",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
